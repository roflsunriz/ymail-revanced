name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean test lint :patches:buildAndroid

      - name: Verify Android RVP
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem patches/build/libs/patches-*.rvp | Where-Object { $_.Name -notmatch '(sources|javadoc)' })
          if ($bundles.Count -ne 1) { throw "Expected one release RVP, found $($bundles.Count)" }
          ./scripts/verify-android-rvp.ps1 -Path $bundles[0].FullName

      - name: Generate Manager metadata
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath gradle.properties -Pattern '^version\s*=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          ./scripts/generate-patches-json.ps1 -Version $version -OutputPath dist/patches.json

      - uses: actions/upload-artifact@v7
        with:
          name: ymail-patches
          path: |
            patches/build/libs/patches-*.rvp
            !patches/build/libs/patches-*-sources.rvp
            !patches/build/libs/patches-*-javadoc.rvp
            dist/patches.json
